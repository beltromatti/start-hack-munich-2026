# The desk with example data as static files, plus /api/ask (src/worker.js) for the ask field.
# The OpenAI key is a secret (wrangler secret put OPENAI_API_KEY), never in a file.
name = "milan-desk"
main = "src/worker.js"
compatibility_date = "2025-09-01"
account_id = "9428423ecf14a5fa2aa4899739698b92"

[assets]
directory = "../../frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true
